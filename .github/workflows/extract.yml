
name: Extract ZIP Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi
          mkdir extracted
          unzip -o "$ZIP" -d extracted
          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            cp -Rn "$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)/." .
          else
            cp -Rn extracted/. .
          fi
          rm -rf extracted
          rm -f "$ZIP"

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract project ZIP"
            git push
          fi
